[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postfilter"
version = "0.1.0"
description = "Re-rank ranked candidates by a sound exclusion constraint, applied after scoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Carl du Plessis" }]
keywords = ["knowledge-graph", "link-prediction", "re-ranking", "constraints"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["postfilter*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
